[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bifrost-cm"
version = "0.1.0"
description = "Bifrost Connection Manager — cross-platform terminal and connection manager (MobaXterm-style) built with PyQt6"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
dependencies = [
    "PyQt6>=6.6",
    "psutil>=5.9",
    "pyte>=0.8.2",
    "paramiko>=3.4",
    "cryptography>=41",
    "keyring>=24.0",
    "pywinpty>=2.0; sys_platform == 'win32'",
]

[project.scripts]
bifrost-cm = "bifrost_app:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]
serial = [
    "pyserial>=3.5",
]

[tool.setuptools]
py-modules = [
    "bifrost_app",
    "bifrost_app_deps",
    "bifrost_app_persistence_tabs",
    "bifrost_app_remote_files",
    "bifrost_app_sessions",
    "bifrost_app_settings_tools",
    "bifrost_app_ssh_status",
    "bifrost_app_tabs",
    "bifrost_app_terminal_sessions",
]

[tool.setuptools.packages.find]
include = ["core*", "widgets*"]

[tool.setuptools.data-files]
"res/icons/material" = ["res/icons/material/*.svg"]
